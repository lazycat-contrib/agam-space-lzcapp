application:
  subdomain: agam
  oidc_redirect_path: /api/v1/auth/sso/oidc/callback

  public_path:
    - /

  upstreams:
    - location: /
      backend: http://agam:3331/

services:
  postgres:
    # upstream: library/postgres:15.19-alpine
    image: docker.1ms.run/library/postgres:15.19-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD={{ stable_secret "db_password" }}
      - POSTGRES_DB=agam_space
    binds:
      - /lzcapp/var/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  agam:
    # upstream: ghcr.io/agam-space/agam-space:0.3.0
    image: ghcr.1ms.run/agam-space/agam-space:0.3.0
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD={{ stable_secret "db_password" }}
      - DATABASE_NAME=agam_space
      - HTTP_PORT=3331
      - ALLOW_NEW_SIGNUP=true
      - DEFAULT_USER_STORAGE_QUOTA={{.U.default_user_storage_quota}}
      - CORS_ORIGIN=*
      # OIDC SSO Configuration - LazyCat v1.3.5+ unified OIDC support
      # Automatically generated by LazyCat when OIDC is enabled
      #
      - SSO_CLIENT_ID=${LAZYCAT_AUTH_OIDC_CLIENT_ID}
      - SSO_CLIENT_SECRET=${LAZYCAT_AUTH_OIDC_CLIENT_SECRET}
      - SSO_ISSUER=${LAZYCAT_AUTH_OIDC_ISSUER_URI}
      - SSO_REDIRECT_URI=https://${LAZYCAT_APP_DOMAIN}/api/v1/auth/sso/oidc/callback
      - SSO_AUTO_CREATE_USER=true
    binds:
      - /lzcapp/var/files:/data/files
    depends_on:
      - postgres
    cpu_shares: 1024
    mem_limit: 1024M
