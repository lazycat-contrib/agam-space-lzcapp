name: Agam Space
package: cloud.lazycat.app.agam-space
version: 0.2.4
min_os_version: 1.3.8
description: "Self-hosted, zero-knowledge, end-to-end encrypted file storage"
license: MIT
homepage: https://github.com/agam-space/agam-space
author: Agam Space Team

application:
  subdomain: agam
  oidc_redirect_path: /api/v1/auth/sso/oidc/callback

  public_path:
    - /

  upstreams:
    - location: /
      backend: http://agam:3331/

services:
  postgres:
    image: registry.lazycat.cloud/czyt/library/postgres:76b8a50fbf810174
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agam_space
    binds:
      - /lzcapp/var/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  agam:
    #  agamspace/agam-space:0.2.4
    image: registry.lazycat.cloud/czyt/agamspace/agam-space:8f97305a13ae0770
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=agam_space
      - HTTP_PORT=3331
      - ALLOW_NEW_SIGNUP=true
      - DEFAULT_USER_STORAGE_QUOTA={{.U.default_user_storage_quota}}
      - CORS_ORIGIN=*
      # OIDC SSO Configuration - LazyCat v1.3.5+ unified OIDC support
      # Automatically generated by LazyCat when OIDC is enabled
      #
      - SSO_CLIENT_ID=${LAZYCAT_AUTH_OIDC_CLIENT_ID}
      - SSO_CLIENT_SECRET=${LAZYCAT_AUTH_OIDC_CLIENT_SECRET}
      - SSO_ISSUER=${LAZYCAT_AUTH_OIDC_ISSUER_URI}
      - SSO_REDIRECT_URI=https://${LAZYCAT_APP_DOMAIN}/api/v1/auth/sso/oidc/callback
      - SSO_AUTO_CREATE_USER=true
    volumes:
      - /lzcapp/var/files:/data/files
    depends_on:
      - postgres
    restart: unless-stopped
    cpu_shares: 1024
    mem_limit: 1024M

locales:
  en:
    name: "Agam Space"
    description: "Self-hosted, zero-knowledge, end-to-end encrypted file storage"
  zh:
    name: "Agam Space"
    description: "自托管、 零知识 、端到端加密的文件存储"
